services:
  db:
    ports:
      - "5432:5432"

  setup:
    image: myhot-setup:deploy-${AIHOT_DEPLOY_REV:?Set AIHOT_DEPLOY_REV}
    build:
      args:
        DEBIAN_MIRROR: mirrors.cloud.tencent.com
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the server .env}

  go-api:
    image: myhot-go-backend:deploy-${AIHOT_DEPLOY_REV:?Set AIHOT_DEPLOY_REV}
    build:
      args:
        GO_IMAGE: mirror.ccs.tencentyun.com/library/golang:1.25.1-alpine
        ALPINE_IMAGE: mirror.ccs.tencentyun.com/library/alpine:3.22
        ALPINE_MIRROR: mirrors.cloud.tencent.com
        GOPROXY: https://goproxy.cn
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the server .env}

  go-worker:
    image: myhot-go-backend:deploy-${AIHOT_DEPLOY_REV:?Set AIHOT_DEPLOY_REV}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the server .env}

  web:
    image: myhot-web:deploy-${AIHOT_DEPLOY_REV:?Set AIHOT_DEPLOY_REV}
    build:
      args:
        DEBIAN_MIRROR: mirrors.cloud.tencent.com
